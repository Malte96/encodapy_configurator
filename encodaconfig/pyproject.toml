[tool.poetry]
name = "encodaconfig"
version = "0.1.0"
description = "Visual configuration creation and validation tool for EnCoDaPy (Streamlit)."
license = "BSD-3-Clause"
authors = ["Martin Altenburger <martin.altenburger@tu-dresden.de>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
encodapy = { path = "..", develop = true }
streamlit = ">=1.40"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
